<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DB Project 2 Registration and Login</title>
</head>
<body>
<main>
  <h2>Register</h2>
<form id="register-form">
  <label>First Name:</label>
  <input type="text" id="reg-firstname" name="firstname" required><br><br>

  <label>Last Name:</label>
  <input type="text" id="reg-lastname" name="lastname" required><br><br>

  <label>Password:</label>
  <input type="text" id="reg-password" name="password" required><br><br>

  <label>Email:</label>
  <input type="text" id="reg-email" name="email" required><br><br>

  <label>Address:</label>
  <input type="text" id="reg-address" name="address"><br><br>

  <label>Phone Number:</label>
  <input type="text" id="reg-phonenum" name="phonenum"><br><br>

  <label>Credit Card:</label>
  <input type="text" id="reg-creditcard" name="creditcard"><br><br>

  <button type="submit">Register</button>
</form>

  <h2>Login</h2>
  <form id="login-form">
    <label>Email:</label>
    <input type="text" id="login-email" name="email" required>
    <br><br>
    <label>Password:</label>
    <input type="password" id="login-password" name="password" required>
    <br><br>
    <button type="submit">Login</button>
  </form>
</main>
<script src="index1.js"></script>
</body>
</html>
