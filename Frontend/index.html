<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DB Project 2 Registration and Login</title>
  <link rel ="stylesheet" href="style.css">
</head>
<body>
<main>

  <h1>Clearly Cleaning</h1> 

  <br><br>

  <h2>Welcome to Clearly Cleaning. We make sure your every need it met quickly and confidently.</h2>

  <br><br>

  <div class="form-container">
    <div class="register-section">
      <h2 class = "register-head">Register</h2>
      <form id="register-form" class = "register-head">
      <label>First Name:</label>
      <input type="text" id="reg-firstname" name="firstname" required><br><br>

      <label>Last Name:</label>
      <input type="text" id="reg-lastname" name="lastname" required><br><br>

      <label>Password:</label>
      <input type="text" id="reg-password" name="password" required><br><br>

      <label>Email:</label>
      <input type="text" id="reg-email" name="email" required><br><br>

      <label>Address:</label>
      <input type="text" id="reg-address" name="address"><br><br>

      <label>Phone Number:</label>
      <input type="text" id="reg-phonenum" name="phonenum"><br><br>

      <label>Credit Card:</label>
      <input type="text" id="reg-creditcard" name="creditcard"><br><br>

      <button type="submit">Register</button>
    </form>
    </div>

<div class = "login-section">
  <h2 class = "login-head">Login</h2>
  <form id="login-form" class = "login-head">
    <label>Email:</label>
    <input type="text" id="login-email" name="email" required>
    <br><br>
    <label>Password:</label>
    <input type="password" id="login-password" name="password" required>
    <br><br>
    <button type="submit">Login</button>
  </form>
  </div>
  </div>
</main>
<script src="index1.js"></script>
</body>
</html>
